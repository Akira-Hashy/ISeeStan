<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapay Zeka Asistanı</title>
<style>
:root{--bg:#fbfaf7;--fg:#16161a;--mute:#5b5b66;--card:#fff;--line:#d9d6cc;--acc:#0b4fd6;--accfg:#fff;--me:#e8eefc;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--fg:#f2f1ec;--mute:#a4a4ae;--card:#1a1b20;--line:#33343b;--acc:#ffd23f;--accfg:#16161a;--me:#232a3d;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{padding:14px 16px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;flex:1 1 100%}
select,button,textarea{font:inherit;color:inherit}
select{padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);flex:1}
label.sp{display:flex;align-items:center;gap:8px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line)}
.me{align-self:flex-end;background:var(--me)}
.ai{align-self:flex-start;background:var(--card)}
.error{color:var(--err);border-color:var(--err)}
.empty{color:var(--mute);margin:auto;text-align:center;padding:0 24px}
form{padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
#preview{display:none;align-items:center;gap:10px}
#preview img{height:56px;border-radius:8px;border:1px solid var(--line)}
.row{display:flex;gap:8px}
textarea{flex:1;min-height:52px;max-height:140px;resize:vertical;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
button{min-height:52px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer}
button.main{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <h1>Yapay Zeka Asistanı</h1>
  <label class="sr" for="mode">Mod</label>
  <select id="mode">
    <option value="gorme">Fotoğraf anlatıcı (görme engelliler için)</option>
    <option value="genel">Genel sohbet</option>
  </select>
  <label class="sp"><input type="checkbox" id="speak" checked> Sesli oku</label>
</header>

<main id="log" aria-live="polite" aria-label="Konuşma">
  <p class="empty" id="empty">Bir fotoğraf seç veya mesaj yaz.</p>
</main>

<form id="f">
  <div id="preview"><img id="thumb" alt="Seçilen fotoğraf"><button type="button" id="rm">Fotoğrafı kaldır</button></div>
  <div class="row">
    <label class="sr" for="text">Mesajın</label>
    <textarea id="text" placeholder="Mesaj yaz (fotoğrafla birlikte soru da sorabilirsin)"></textarea>
  </div>
  <div class="row">
    <input type="file" id="file" accept="image/*" hidden>
    <button type="button" id="pick">Fotoğraf seç</button>
    <button class="main" id="send" type="submit" style="flex:1">Gönder</button>
  </div>
</form>

<script>
const $ = id => document.getElementById(id);
const log = $("log"), text = $("text"), send = $("send");
let image = null, history = [], busy = false;

function add(cls, t){
  const e = $("empty"); if (e) e.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = t;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

function say(t){
  if (!$("speak").checked || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "tr-TR";
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("tr"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// Fotoğrafı en uzun kenarı 1024 px olacak şekilde küçült: büyük istek ve limit hatalarını önler.
function shrink(file){
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1024 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("Fotoğraf açılamadı.")); };
    img.src = url;
  });
}

$("pick").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    image = await shrink(f);
    $("thumb").src = image; $("preview").style.display = "flex";
  } catch (x) { add("ai error", x.message); }
  e.target.value = "";
};
$("rm").onclick = () => { image = null; $("preview").style.display = "none"; };

$("f").onsubmit = async e => {
  e.preventDefault();
  if (busy) return;
  const t = text.value.trim();
  if (!t && !image) return;
  busy = true; send.disabled = true; send.textContent = "Düşünüyor…";
  const mode = $("mode").value;
  add("me", (image ? "[Fotoğraf] " : "") + t);
  const payload = { mode, text: t, image, history };
  text.value = ""; image = null; $("preview").style.display = "none";
  const wait = add("ai", "…");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Bir hata oluştu (" + r.status + ").");
    wait.textContent = d.reply;
    history.push({ role: "user", content: (payload.image ? "[Fotoğraf gönderildi] " : "") + t });
    history.push({ role: "assistant", content: d.reply });
    history = history.slice(-10);
    say(d.reply);
  } catch (x) {
    wait.className = "msg ai error";
    wait.textContent = x.message === "Failed to fetch"
      ? "Sunucuya ulaşılamadı. Sunucu uyanıyor olabilir, 30 saniye sonra tekrar dene."
      : x.message;
  } finally {
    busy = false; send.disabled = false; send.textContent = "Gönder";
    log.scrollTop = log.scrollHeight;
  }
};

$("mode").onchange = () => { history = []; };
if ("speechSynthesis" in window) speechSynthesis.getVoices();
</script>
</body>
</html>
